# GitHub の画面で Release を公開すると、Windows 用の zip を作ってその Release に添付する
# （Actions タブから手動で動かすと、ビルド結果を Artifacts として受け取れる）
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --win zip --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Quiver-win
          path: |
            dist/*.zip
            firmware/quiver-remapper-rp2040-pizero.uf2

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.zip
            firmware/quiver-remapper-rp2040-pizero.uf2
