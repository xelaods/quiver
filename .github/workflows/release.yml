# バージョンのタグ（v1.5.0 など）を push すると、Windows 用の zip を作って Releases に公開する
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-builder --win zip --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Quiver-win
          path: |
            dist/*.zip
            firmware/quiver-remapper-rp2040-pizero.uf2

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Quiver ${{ github.ref_name }}
          files: |
            dist/*.zip
            firmware/quiver-remapper-rp2040-pizero.uf2
          body: |
            - `Quiver-*-win.zip`：Windows 用アプリ。解凍して `Quiver.exe` を起動します（インストール不要）
            - `quiver-remapper-rp2040-pizero.uf2`：Waveshare RP2040-PiZero 用の専用ファーム（Quiver3）

            初回起動で Windows SmartScreen の警告が出たら「詳細情報」→「実行」を押してください。
